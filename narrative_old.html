<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMBIC-SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;800&family=IBM+Plex+Mono:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =====================================================================
   LIMBIC-SYSTEM  ·  Dr. Vance × Blanc  ·  profile + timeline archive
   dark  = Vance / Verde  (black + green)
   light = Blanc / Glacies (white + blue)
   ===================================================================== */
:root{
  --bg:#050505; --fg:#f4f4f4;
  --ac:#19ff6a; --green:#19ff6a; --blue:#0a3dff;
  --dim:rgba(244,244,244,.5); --line:rgba(244,244,244,.16); --line2:rgba(244,244,244,.34);
  --ac-dim:rgba(25,255,106,.16); --blend:screen; --grain:screen;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --px:'Pixelify Sans','IBM Plex Mono',monospace;
  --kr:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --grot:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --figH:min(52vh,560px);
}
:root[data-theme=light]{
  --bg:#f6f6f4; --fg:#0a0a0a;
  --ac:#0a3dff; --green:#00a03e; --blue:#0a3dff;
  --dim:rgba(10,10,10,.5); --line:rgba(10,10,10,.14); --line2:rgba(10,10,10,.3);
  --ac-dim:rgba(0,56,255,.12); --blend:multiply; --grain:multiply;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
b{font-weight:600}
.kr{font-family:var(--kr)}
::selection{background:var(--ac);color:var(--bg)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
main{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;overflow:hidden}
.screen.active{opacity:1;visibility:visible;transition:opacity .45s}
#theme{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;opacity:.8;transition:opacity .2s}
#theme:hover{opacity:1}
#theme .sw{position:relative;width:30px;height:14px;border:1px solid currentColor;border-radius:8px}
#theme .sw::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:currentColor;transition:transform .45s cubic-bezier(.7,0,.2,1)}
#theme .a,#theme .b{opacity:.4;transition:opacity .3s}
:root:not([data-theme=light]) #theme .a,:root[data-theme=light] #theme .b{opacity:1}
:root[data-theme=light] #theme .sw::after{transform:translateX(16px)}
#theme:active .sw::after{width:12px}
.dim{color:var(--dim)} .acc{color:var(--ac)}
/* film grain over everything */
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:35;pointer-events:none;opacity:.28;mix-blend-mode:var(--grain)}
:root[data-theme=light] .grain{opacity:.16}

/* =====================================================================
   HOME  ·  scroll-driven decode  →  final illustration
   ===================================================================== */
#home{background:var(--bg);overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
#home::-webkit-scrollbar{display:none}
.track{position:relative;height:calc(var(--steps,8) * var(--stepH,80vh) + 100vh)}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;--c:var(--ac)}
.stage[data-char=A]{--c:var(--green)} .stage[data-char=B]{--c:var(--blue)}
.stage>*{transition:opacity .5s}
#figc{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;transition:opacity .6s,filter .08s}
#figc.chroma{filter:drop-shadow(3px 0 0 var(--c)) drop-shadow(-3px 0 0 color-mix(in srgb,var(--fg) 55%,transparent))}
#figc.hov{cursor:crosshair}
#leads{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
#leads .ln{fill:none;stroke:var(--fg);stroke-width:1.1}
#leads .dt{fill:var(--fg)}
#leads .ring{fill:none;stroke:var(--c);stroke-width:1.2}
#leads .tm{stroke:var(--fg);stroke-width:1.4}
#leads .bb{fill:none;stroke:var(--fg);stroke-width:.8;opacity:.75}
#leads .hd{fill:var(--fg)}
#leads .bbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;fill:var(--dim)}
#leads g{transition:opacity .35s}
#leads g.out{opacity:0}
#labels{position:absolute;inset:0;z-index:4;pointer-events:none}
.lbl{position:absolute;top:0;left:0;white-space:nowrap;line-height:1.15;transition:opacity .35s;will-change:transform}
.lbl.out{opacity:0}
.lbl .k{display:block;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--c);margin-bottom:3px}
.lbl .v{display:block;font-family:var(--grot);font-weight:400;font-size:clamp(15px,1.6vw,22px);letter-spacing:-.02em;text-transform:uppercase}
.lbl .s{display:block;font-size:9px;letter-spacing:.06em;color:var(--dim);margin-top:3px;font-family:var(--kr)}
.lbl.R{text-align:left} .lbl.L{text-align:right}

/* intro hero */
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;text-align:center;pointer-events:none;color:var(--fg);transition:opacity .5s,transform .8s cubic-bezier(.7,0,.2,1)}
.hero .hl.in{position:absolute;inset:0;color:var(--bg);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.hero h1{margin:0;font-family:var(--serif);font-weight:400;line-height:.86}
.hero h1 em{display:block;font-style:italic;font-size:clamp(32px,5vw,76px)}
.hero h1 strong{display:block;font-weight:400;font-size:clamp(56px,10vw,160px);letter-spacing:-.03em}
.hero .sub{margin:12px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.stage:not([data-step="0"]) .hero{opacity:0;transform:translateY(-58%)}

.hint{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);z-index:5;font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.hint .hn{display:flex;flex-direction:column;align-items:center;gap:8px}
.hint .hn.in{position:absolute;inset:0;color:var(--bg);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.hint i{width:1px;height:34px;background:linear-gradient(currentColor,transparent);animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.stage:not([data-step="0"]) .hint{opacity:0}
.prog{position:absolute;right:2.2vw;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
.prog i{position:relative;width:1px;height:22vh;background:var(--line2)}
.prog i b{position:absolute;left:-1px;top:0;width:3px;height:0;background:var(--fg);transition:height .4s}
.prog .n{color:var(--fg)}

/* bottom name block */
.nb{position:absolute;left:5vw;right:5vw;bottom:3.5vh;z-index:5;pointer-events:none;transition:opacity .45s}
.nb::before{content:'';position:absolute;left:-5vw;right:-5vw;bottom:-3.5vh;height:calc(100% + 16vh);background:linear-gradient(transparent,var(--bg) 46%);z-index:-1}
.nb .r1{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg)}
.nb .r1>div{padding:12px 0 10px}
.nb .r1 .rt{border-left:1px solid var(--fg);padding-left:clamp(16px,5vw,90px);text-align:right}
.nb small{display:block;font-family:var(--grot);font-size:clamp(13px,min(2.2vw,3.6vh),30px);letter-spacing:-.02em;line-height:1;text-transform:uppercase}
.nb b{display:block;font-family:var(--grot);font-weight:400;font-size:clamp(28px,min(6.4vw,10.5vh),92px);letter-spacing:-.045em;line-height:.9;text-transform:uppercase;margin-top:2px}
.nb .rt b{font-weight:800;letter-spacing:-.04em}
.nb .r2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--fg)}
.nb .r2>div{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:10px 0 12px;font-size:11px;line-height:1.5}
.nb .r2>div+div{border-left:1px solid var(--fg);padding-left:18px}
.nb .r2 em{font-style:normal;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:var(--grot);font-size:13px}
.nb .r2 p{margin:0;font-family:var(--kr);text-align:justify;padding-right:18px}
.nb .r3{display:flex;justify-content:space-between;padding-top:10px;font-family:var(--grot);font-size:clamp(12px,1.2vw,16px);text-transform:uppercase;letter-spacing:-.01em}
.stage[data-step="0"] .nb,.stage[data-step="8"] .nb{opacity:0}
.nb .sw{display:inline-block;transition:opacity .2s}

/* =====================================================================
   FINAL  ·  hazy illustration + frames
   ===================================================================== */
.final{position:absolute;inset:0;z-index:8;opacity:0;visibility:hidden;transition:opacity .9s,visibility 0s .9s;color:var(--fg)}
.stage[data-step="8"] .final{opacity:1;visibility:visible;transition:opacity .9s}
.stage[data-step="8"] #figc,.stage[data-step="8"] #leads,.stage[data-step="8"] #labels,.stage[data-step="8"] .prog{opacity:0}
.f-bg{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.f-bg img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;pointer-events:none}
.f-bg .f-fill{width:100%;height:100%;object-fit:cover;filter:blur(30px) saturate(.6) brightness(.8);transform:scale(1.15);transform-origin:50% 50%}
.f-bg .f-blur{filter:blur(7px) saturate(.75) contrast(.92)}
.f-bg .f-blur.edge{-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-composite:intersect}
.f-veil{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 110%,color-mix(in srgb,var(--bg) 82%,transparent),transparent 62%),
  linear-gradient(color-mix(in srgb,var(--bg) 38%,transparent),color-mix(in srgb,var(--bg) 52%,transparent));
  backdrop-filter:saturate(.85);-webkit-backdrop-filter:saturate(.85)}
:root[data-theme=light] .f-veil{background:
  radial-gradient(120% 80% at 50% 110%,rgba(246,246,244,.85),transparent 62%),
  linear-gradient(rgba(246,246,244,.42),rgba(246,246,244,.5))}
.f-tags{position:absolute;top:3.2vh;left:4vw;right:4vw;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.04em;color:var(--fg);opacity:.75;pointer-events:none}
.f-tags .r{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 3vw;text-align:right}
.f-panel{position:absolute;left:4vw;right:4vw;top:7.5vh;bottom:5vh;border:1px solid color-mix(in srgb,var(--fg) 45%,transparent);border-radius:12px;pointer-events:none}
.f-panel a,.f-panel button{pointer-events:auto}
.f-cta{position:absolute;left:50%;top:56%;width:min(26vw,320px);display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.f-btns{display:flex;gap:8px;flex-wrap:wrap}
.f-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--fg);border-radius:4px;padding:3px 8px;font-family:var(--grot);font-size:11px;text-transform:uppercase;transition:.15s}
.f-btn:hover{background:var(--fg);color:var(--bg)}
.f-btn::after{content:'';border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.f-note{align-self:stretch;font-family:var(--grot);font-size:12px;line-height:1.25}
.f-note p{margin:0 0 12px}
.f-note a{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:color-mix(in srgb,var(--fg) 16%,transparent);border-radius:3px;font-weight:600;transition:.15s}
.f-note a:hover{background:var(--fg);color:var(--bg)}
.f-note a::after{content:'';border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.f-giant{position:absolute;left:18px;bottom:10px;display:block;font-family:var(--grot);font-weight:800;font-size:11vw;line-height:.74;letter-spacing:-.06em;pointer-events:none;white-space:nowrap}
.f-giant i{flex:none;width:0;height:0;border-left:.37em solid transparent;border-right:.37em solid transparent;border-bottom:.64em solid currentColor;margin-bottom:.01em}
/* frames over the illustration */
.f-wins{position:absolute;inset:0;pointer-events:none;z-index:2}
.f-panel{z-index:auto} .f-cta{z-index:3}
.f-faces{position:absolute;inset:0;pointer-events:none;z-index:4}
.f-giant{z-index:5}
.win{position:absolute;pointer-events:auto;border:1px solid color-mix(in srgb,var(--fg) 75%,transparent);border-radius:7px;overflow:visible;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s,border-color .2s}
.stage[data-step="8"] .win{opacity:1;transform:none}
.win .wi{position:absolute;inset:0;border-radius:6px;background-repeat:no-repeat;overflow:hidden;filter:saturate(1.05)}
.win .wi::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.08) 3px 4px);opacity:0;transition:.2s}
.win .ht{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:5px;background:color-mix(in srgb,var(--bg) 55%,transparent);display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.win .ht svg{width:12px;height:12px;fill:none;stroke:var(--fg);stroke-width:1.6}
.win .ht.on svg{fill:var(--c);stroke:var(--c)}
.win.capt .cap{top:auto;bottom:calc(100% + 7px)}
.win[data-cap=bi] .cap{top:auto;bottom:8px;left:8px!important;right:8px!important;width:auto!important}
.win .cap{z-index:50} .win .ht,.win .hdl,.win .tag{z-index:45}
.win.deco:hover .wi{z-index:25!important}
.win .cap{position:absolute;left:0;right:0;top:calc(100% + 7px);display:flex;justify-content:space-between;gap:10px;font-family:var(--grot);font-size:10px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.win .cap span{opacity:.7}
.win .hdl{position:absolute;width:7px;height:7px;background:var(--fg);opacity:0;transition:opacity .2s}
.win .hdl.a{left:-4px;top:-4px} .win .hdl.b{left:calc(50% - 3.5px);top:-4px} .win .hdl.c{right:-4px;top:-4px}
.win .hdl.d{left:-4px;top:calc(50% - 3.5px)} .win .hdl.e{right:-4px;top:calc(50% - 3.5px)}
.win .hdl.f{left:-4px;bottom:-4px} .win .hdl.g{left:calc(50% - 3.5px);bottom:-4px} .win .hdl.h{right:-4px;bottom:-4px}
.win .tag{position:absolute;left:8px;bottom:8px;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;padding:2px 6px;background:var(--fg);color:var(--bg);border-radius:2px;opacity:0;transform:translateY(4px);transition:.2s}
.win.go{cursor:pointer}
.win.go:hover{border-color:var(--c)}
.win.go:hover .hdl,.win.go:hover .tag{opacity:1;transform:none}
.win:hover .wi::after{opacity:1}
.win.deco{border-color:color-mix(in srgb,var(--fg) 45%,transparent)}
.win.deco .wi{opacity:0;transition:opacity .3s}
.win.deco:hover .wi{opacity:1}
.win.zoom{z-index:30;transition:transform .9s cubic-bezier(.75,0,.18,1),opacity .3s;border-color:transparent}
.win.zoom .cap,.win.zoom .ht,.win.zoom .tag,.win.zoom .hdl{opacity:0!important}
.final.leaving>*:not(.f-wins):not(.f-faces){opacity:.0;transition:opacity .5s}
.final.leaving .win:not(.zoom){opacity:0}

@media (max-width:960px){
  #home.screen{position:fixed;inset:0;height:100%}
  .lbl .v{font-size:13px} .lbl .s{display:none}
  .nb .r2{display:none}
  .nb b{font-size:min(12vw,8vh)}
  .prog{display:none}
  .f-tags{font-size:8.5px;left:12px;right:12px;top:40px}
  .f-panel{top:68px}
  .f-tags .r{gap:2px 10px;max-width:70%}
  .f-cta{left:18px;top:auto;bottom:calc(var(--giantH,60px) + 26px);width:min(70vw,300px);gap:10px}
  .f-note p{display:none}
  .f-panel{left:12px;right:12px}
}
@media (prefers-reduced-motion:reduce){
  .hint i{animation:none}
}

/* =====================================================================
   PROFILE
   ===================================================================== */
#profile{--portW:300px;background:var(--bg)}
#timeline{background:var(--bg)}
.p-head{
  position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;z-index:5;background:var(--bg)
}
.p-head button{padding:6px 0;color:var(--dim)}
.p-head button:hover{color:var(--fg)}
#profile .p-head button{color:var(--hc,#fff);text-shadow:0 0 6px var(--hh,rgba(0,0,0,.6)),0 0 14px var(--hh,rgba(0,0,0,.45));transition:color .4s,text-shadow .4s} #profile .p-head button:hover{opacity:.7}
.p-body{position:absolute;inset:44px 0 0 0}
.p-left{
  position:absolute;left:24px;top:24px;bottom:24px;width:var(--portW);display:flex;flex-direction:column;justify-content:center;gap:16px;overflow:auto;z-index:3;
}
.portrait{position:relative;flex:none;width:100%;aspect-ratio:3/4;border:1px solid var(--fg);overflow:hidden;background:var(--bg)}
.portrait .img{position:absolute;inset:0}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15) brightness(1.02);transform:scale(2.6);transform-origin:50% 16%;transition:transform 1.2s cubic-bezier(.2,.85,.2,1)}
.portrait.in img{transform:scale(1)}
.portrait .img.none img{display:none}
.portrait .img.none svg{position:absolute;inset:10%;width:80%;height:80%;color:var(--fg)}
.portrait .tint{position:absolute;inset:0;background:var(--ac);mix-blend-mode:var(--blend);opacity:.24;pointer-events:none}
.portrait .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px);pointer-events:none;mix-blend-mode:multiply}
:root[data-theme=light] .portrait .lines{background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.35) 3px 4px);mix-blend-mode:normal}
.portrait .scanline{position:absolute;left:0;right:0;height:1px;background:var(--ac);opacity:.8;animation:pscan 4s linear infinite;box-shadow:0 0 8px var(--ac)}
@keyframes pscan{from{top:-2px}to{top:101%}}
.portrait .cn{position:absolute;width:14px;height:14px;border:0 solid var(--ac)}
.portrait .cn.tl{left:6px;top:6px;border-width:1.5px 0 0 1.5px}
.portrait .cn.tr{right:6px;top:6px;border-width:1.5px 1.5px 0 0}
.portrait .cn.bl{left:6px;bottom:6px;border-width:0 0 1.5px 1.5px}
.portrait .cn.br{right:6px;bottom:6px;border-width:0 1.5px 1.5px 0}
.portrait .hud{position:absolute;left:26px;right:26px;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);display:flex;justify-content:space-between}
.portrait .hud span{background:var(--bg);padding:1px 5px}
.portrait .hud.t{top:12px;justify-content:flex-end}
.portrait .hud .acc{color:var(--ac)}
.portrait .cross{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);opacity:.7}
.portrait .cross::before,.portrait .cross::after{content:'';position:absolute;background:var(--ac)}
.portrait .cross::before{left:50%;top:0;bottom:0;width:1px}
.portrait .cross::after{top:50%;left:0;right:0;height:1px}
.portrait .cross i{position:absolute;inset:7px;border:1px solid var(--ac);border-radius:50%}
.quote{margin:0;padding:12px 14px;border-left:2px solid var(--ac);font-family:var(--kr);font-size:12px;line-height:1.65}
.quote small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim);margin-top:6px;text-transform:uppercase}

.legend{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.legend .lh{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:8px 0 4px;display:flex;justify-content:space-between}
.legend li.it{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.1em;cursor:pointer;transition:.15s}
.legend li.it .n{color:var(--ac);font-size:8.5px}
.legend li.it .k .kr{color:var(--dim);margin-left:6px;font-size:10px;letter-spacing:0}
.legend li.it .w{font-size:8.5px;color:var(--dim)}
.legend li.it .w i{font-style:normal;color:var(--ac);letter-spacing:-1px;margin-right:6px}
.legend li.it:hover,.legend li.it.hi{padding-left:6px;background:var(--ac-dim)}

.donut-wrap{position:absolute;left:calc(var(--portW) + 106px);top:50%;transform:translateY(-50%);width:520px;height:520px;z-index:1}
#donut{width:100%;height:100%;overflow:visible;display:block}
/* glass half donut: frosted segments (backdrop blur clipped per segment) + translucent tint, rim light, inner glow */
#donut{position:relative;z-index:1}
#dfrost{position:absolute;inset:0;pointer-events:none}
.dfrost{position:absolute;inset:0;pointer-events:none;backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
.dfrost.hi{transform:translate(var(--tx),var(--ty))}
#donut .seg{cursor:default;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
#donut .seg .sf{fill:url(#dgFill)}
#donut .seg .sa{fill:var(--ac);opacity:0;transition:opacity .25s}
#donut .seg .sg{fill:none;stroke:var(--dgGlow);stroke-width:2.5}
#donut .seg .se{fill:none;stroke:url(#dgEdge);stroke-width:1;transition:stroke .25s}
#donut .seg.hi{transform:translate(var(--tx),var(--ty))}
#donut .seg.hi .sa{opacity:.22}
#donut .seg.hi .se{stroke:var(--ac)}
#donut.hover .seg:not(.hi){opacity:.6}
#profile{--dg1:rgba(255,255,255,.12);--dg2:rgba(255,255,255,.025);--de1:rgba(255,255,255,.62);--de2:rgba(255,255,255,.14);--dgGlow:rgba(255,255,255,.14)}
:root[data-theme=light] #profile{--dg1:rgba(255,255,255,.62);--dg2:rgba(255,255,255,.22);--de1:rgba(255,255,255,1);--de2:rgba(10,10,10,.12);--dgGlow:rgba(255,255,255,.7)}
.donut-center{position:absolute;left:0;top:0;pointer-events:none;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;z-index:2}
.donut-center .big{font-size:30px;letter-spacing:-.01em;font-weight:600;line-height:1}
.donut-center .big.kr{font-family:var(--kr);letter-spacing:.06em;text-orientation:upright;font-weight:600}
#dtip{
  position:fixed;z-index:60;width:280px;padding:12px 14px;border:1px solid var(--fg);background:var(--bg);
  opacity:0;pointer-events:none;transition:opacity .15s;font-size:11px;
}
#dtip.show{opacity:1}
#dtip .h{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);display:flex;justify-content:space-between;margin-bottom:6px}
#dtip .t{font-size:12px;letter-spacing:.1em;margin-bottom:4px}
#dtip .t .kr{color:var(--dim);margin-left:6px;letter-spacing:0}
#dtip .n{font-family:var(--kr);font-size:11.5px;line-height:1.6;color:var(--fg)}
#dtip .r{margin-top:8px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#dtip .r b{color:var(--fg);font-weight:400}

.p-data{
  position:absolute;left:calc(var(--portW) + 116px + 250px);right:24px;top:24px;bottom:24px;overflow:auto;z-index:2;
  border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  padding:22px 28px 40px;
}
.p-data .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--fg);padding-bottom:10px;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.p-data .top h2{margin:0;font-size:clamp(22px,2.6vw,38px);font-weight:500;letter-spacing:.1em;line-height:1}
.p-data .top h2 small{display:block;font-family:var(--kr);font-size:12px;font-weight:400;letter-spacing:.02em;color:var(--dim);margin-top:6px}
.p-data .top .cls{text-align:right;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);line-height:1.8}
.p-data .top .cls b{color:var(--fg);font-weight:500;display:block;font-size:11px}
.p-data .top .cls .lv{color:var(--ac)}
.sec{margin:0 0 24px}
.sec .sh{display:flex;align-items:baseline;gap:8px;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:10px}
.sec .sh b{color:var(--ac);font-weight:600}
.sec .sh s{text-decoration:none;margin-left:auto}
.ident{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px}
.ident .row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line2);font-size:10.5px;letter-spacing:.08em}
.ident .row .k{color:var(--dim);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;flex:none}
.ident .row .v{text-align:right;font-family:var(--kr);letter-spacing:0}
.ident .row .v.mono{font-family:var(--mono);letter-spacing:.06em}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:82px 14px 1fr;gap:0 8px;padding:0 0 12px;position:relative}
.hist li .t{font-size:8.5px;letter-spacing:.16em;color:var(--dim);padding-top:3px;text-transform:uppercase}
.hist li .rail{color:var(--line2);font-size:11px;line-height:1.2;text-align:center;position:relative}
.hist li .rail::before{content:'├';color:var(--ac)}
.hist li:last-child .rail::before{content:'└'}
.hist li .rail::after{content:'';position:absolute;left:50%;top:14px;bottom:-12px;width:1px;background:var(--line2)}
.hist li:last-child .rail::after{display:none}
.hist li .h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.hist li .p{font-family:var(--kr);font-size:11.5px;line-height:1.65;color:var(--fg)}
.hist li.red .h{color:var(--dim)}
.red-bar{display:inline-block;background:var(--fg);color:var(--fg);letter-spacing:-1px;opacity:.85}
.abil{margin:0;padding:0;list-style:none}
.abil li{display:grid;grid-template-columns:150px 92px 1fr;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line2)}
.abil li .n{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.abil li .m{font-size:11px;letter-spacing:1px;color:var(--ac);white-space:nowrap}
.abil li .m i{font-style:normal;color:var(--line2)}
.abil li .d{font-family:var(--kr);font-size:11px;line-height:1.6;color:var(--fg)}
/* relations: full-width glass node graph, details in a glass popup (#dtip) on hover */
.rel{position:relative;width:100%;height:280px;margin-top:6px}
.rel svg.rlines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.rel svg.rlines path{fill:none;stroke:color-mix(in srgb,var(--fg) 32%,transparent);stroke-width:1;transition:stroke .2s}
.rel svg.rlines path.hi{stroke:var(--ac)}
.rel .rn{position:absolute;transform:translate(-50%,-50%);padding:11px 18px;border-radius:999px;white-space:nowrap;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);cursor:pointer;
  background:linear-gradient(160deg,color-mix(in srgb,var(--fg) 12%,transparent),color-mix(in srgb,var(--fg) 3%,transparent));
  border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh),0 10px 24px -14px rgba(0,0,0,.6);transition:border-color .2s,color .2s}
.rel .rn.c{padding:14px 22px;font-size:11.5px;font-weight:500;cursor:default;background:linear-gradient(160deg,color-mix(in srgb,var(--fg) 18%,transparent),color-mix(in srgb,var(--fg) 5%,transparent))}
.rel .rn.hi{border-color:var(--ac);color:var(--ac)}
.stim{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stim div{border:1px solid var(--line2);padding:8px 10px;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stim div b{display:block;font-size:14px;color:var(--ac);letter-spacing:.06em;margin-top:4px;font-weight:500}
.stim div small{display:block;font-size:7.5px;margin-top:2px}

/* B (Blanc) → mirrored: portrait right, card left. Accent follows the theme like everywhere else (dark → green, light → blue) */
#profile.flip .p-left{left:auto;right:24px}
#profile.flip .donut-wrap{left:auto;right:calc(var(--portW) + 106px)}
#profile.flip .p-data{left:24px;right:calc(var(--portW) + 116px + 250px)}
@media (max-width:1180px){ #profile.flip .p-data{right:calc(var(--portW) + 116px + 176px)} }

/* ---------------------------------------------------------------------
   PROFILE · glass  (giant thin type behind frosted cards, halftone floor)
   --------------------------------------------------------------------- */
#profile{--gl:color-mix(in srgb,var(--fg) 7%,transparent);--glb:color-mix(in srgb,var(--fg) 20%,transparent);--glh:color-mix(in srgb,var(--fg) 34%,transparent);--blur:22px}
:root[data-theme=light] #profile{--gl:rgba(255,255,255,.42);--glb:rgba(10,10,10,.1);--glh:rgba(255,255,255,.9)}
.p-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#profile{--px:0;--py:0}
.p-bg .img{position:absolute;inset:-14px;background:center/cover no-repeat;transform:scale(1.06) translate(calc(var(--px) * -9px),calc(var(--py) * -6px));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.p-blobs{position:absolute;inset:-10%;z-index:0;pointer-events:none;filter:blur(46px);opacity:.95;transform:translate(calc(var(--px) * 26px),calc(var(--py) * 18px));transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1)}
.p-blobs i{position:absolute;border-radius:50%;mix-blend-mode:screen;will-change:transform}
.p-blobs .b1{width:40vw;height:40vw;left:16%;top:-12%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 60%,transparent),transparent 68%);animation:blob1 19s ease-in-out infinite alternate}
.p-blobs .b2{width:32vw;height:32vw;left:52%;top:38%;background:radial-gradient(circle,rgba(255,255,255,.38),transparent 68%);animation:blob2 23s ease-in-out infinite alternate}
.p-blobs .b3{width:28vw;height:28vw;left:2%;top:52%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 42%,transparent),transparent 68%);animation:blob3 27s ease-in-out infinite alternate}
:root[data-theme=light] .p-blobs i{mix-blend-mode:multiply;opacity:.55}
@keyframes blob1{to{transform:translate(14vw,12vh) scale(1.18)}}
@keyframes blob2{to{transform:translate(-18vw,-10vh) scale(.85)}}
@keyframes blob3{to{transform:translate(16vw,-16vh) scale(1.1)}}
#profile:is(.away,.pre) .p-blobs{opacity:0}
.p-spec{position:absolute;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.9;transition:transform .5s cubic-bezier(.7,0,.25,1) .04s,opacity .3s;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 62%),linear-gradient(160deg,rgba(255,255,255,.1),transparent 30%,transparent 75%,rgba(255,255,255,.05))}
:root[data-theme=light] .p-spec{mix-blend-mode:normal;opacity:.7}
#profile:is(.away,.pre) .p-spec{transform:translateX(calc(100% + 80px))} #profile.flip:is(.away,.pre) .p-spec{transform:translateX(calc(-100% - 80px))}
.portrait::after{background:radial-gradient(240px circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.18),transparent 60%),linear-gradient(155deg,rgba(255,255,255,.14),transparent 38%,transparent 70%,rgba(255,255,255,.06))}
.glass,.portrait,.p-data{box-shadow:inset 0 1px 0 var(--glh),inset 0 -1px 0 color-mix(in srgb,var(--fg) 6%,transparent),0 40px 80px -40px rgba(0,0,0,.7),0 0 0 1px color-mix(in srgb,var(--bg) 30%,transparent)}
@media (prefers-reduced-motion:reduce){ .p-blobs i{animation:none} }
.p-bg .veil{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 58%,transparent);transition:opacity .5s}
:root[data-theme=light] .p-bg .veil{background:color-mix(in srgb,var(--bg) 46%,transparent)}
#profile:is(.away,.pre) .p-bg .img{transform:scale(1.04) translate(calc(var(--px) * -9px),calc(var(--py) * -6px))}
#profile:is(.away,.pre) .p-bg .veil{opacity:0}
.p-left{scrollbar-width:none} .p-left::-webkit-scrollbar{display:none}
.legend .lh{gap:10px;white-space:nowrap;font-size:8px}
.p-head{background:transparent}
.p-body,.p-head{z-index:2}
.glass{background:var(--gl);border:1px solid var(--glb);backdrop-filter:blur(var(--blur)) saturate(1.25);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);box-shadow:inset 0 1px 0 var(--glh),0 40px 80px -40px rgba(0,0,0,.7)}
.portrait{border:1px solid var(--glb);border-radius:20px;box-shadow:inset 0 1px 0 var(--glh),0 40px 80px -40px rgba(0,0,0,.7)}
/* portrait as a glass staff ID badge */
.p-left{overflow:visible}
.bwrap{position:relative;flex:none;width:100%}
.badge{position:relative;z-index:1;width:100%;box-sizing:border-box;padding:30px 12px 18px;border-radius:26px}
/* lanyard: flat woven ribbon (near-black, fine weave + stitched edges) → metal crimp → ring hooked into the badge slot */
.bwrap .strap{position:absolute;z-index:2;left:50%;bottom:calc(100% + 14px);width:18px;margin-left:-9px;height:100vh;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,transparent 1px 2px),linear-gradient(90deg,#0a0a0b,#1c1d20 22%,#1c1d20 78%,#0a0a0b);
  box-shadow:0 0 0 .5px rgba(0,0,0,.6),4px 0 10px -6px rgba(0,0,0,.6)}
.bwrap .strap::before{content:'';position:absolute;inset:0 3px;border:dashed rgba(255,255,255,.13);border-width:0 1px}
.bwrap .crimp{position:absolute;z-index:3;left:50%;top:-22px;width:20px;height:9px;margin-left:-10px;border-radius:1.5px;pointer-events:none;
  background:linear-gradient(90deg,#6d7176,#e4e7ea 38%,#a3a8ad 62%,#5d6166);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.5)}
.bwrap .ring{position:absolute;z-index:2;left:50%;top:-15px;width:14px;height:33px;margin-left:-7px;border-radius:5px;pointer-events:none;
  border:2px solid #c3c7cc;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.45),0 2px 3px rgba(0,0,0,.35)}
.badge::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 34%,transparent 72%,rgba(255,255,255,.04))}
.bwrap .slot{position:absolute;z-index:4;left:50%;top:12px;width:54px;height:8px;margin-left:-27px;border-radius:99px;background:color-mix(in srgb,var(--bg) 62%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 1px 0 var(--glh)}
.badge .portrait{border-radius:16px;box-shadow:inset 0 1px 0 var(--glh),0 0 0 1px color-mix(in srgb,var(--bg) 30%,transparent)}
.badge .bid{margin-top:14px;text-align:center;line-height:1.2}
.badge .bid .nm{font-family:var(--grot);font-size:19px;font-weight:400;letter-spacing:-.015em;color:var(--fg)}
.badge .bid .nm .kr{font-family:var(--kr);font-size:13px;letter-spacing:0;color:var(--dim);margin-left:9px}
.badge .bid .un{margin-top:6px;font-family:var(--grot);font-size:12px;letter-spacing:.01em;color:var(--dim)}
.portrait::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.16),transparent 38%,transparent 70%,rgba(255,255,255,.06))}
.portrait .cn{display:none}
.portrait .hud span{background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:4px}
.quote{border-left:0;border-radius:18px;padding:16px 18px;font-family:var(--grot);font-size:14px;line-height:1.35;letter-spacing:-.01em}
.quote small{font-family:var(--mono)}
.legend{border-top:0;border-radius:18px;padding:4px 16px 8px}
.legend li.it:last-child{border-bottom:0}
.legend li.it:hover,.legend li.it.hi{background:transparent}
.p-data{border:0;border-radius:0;background:var(--gl);backdrop-filter:blur(var(--blur)) saturate(1.25);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);padding-top:26px;scrollbar-width:none}
.p-data::-webkit-scrollbar{display:none}
.p-data .top h2{font-family:var(--grot);font-weight:400;letter-spacing:-.035em;font-size:clamp(30px,3.4vw,52px)}
.p-data .top{border-bottom-color:var(--glb)}
.gline{position:absolute;z-index:3;pointer-events:none;overflow:visible}
.gline path{fill:none;stroke:var(--glb);stroke-width:1}
.gline path.hl{stroke:var(--glh);stroke-width:1;opacity:.6}
.donut-center .big{font-family:var(--grot)}
#profile .p-left,#profile .p-data,#profile .gline{transition:transform .5s cubic-bezier(.7,0,.25,1)}
#profile .donut-wrap{transition:transform .5s cubic-bezier(.7,0,.25,1) .03s,opacity .4s}
#profile .p-data,#profile .gline{transition-delay:.04s}
#profile .p-left{transition:transform .75s cubic-bezier(.3,1.25,.45,1)}
#profile:is(.away,.pre) .p-left{transform:translateY(calc(-100% - 120px));transition:transform .7s cubic-bezier(.55,-.22,.3,1)}
#profile:is(.away,.pre) .p-data,#profile:is(.away,.pre) .gline{transform:translateX(calc(100% + 80px))}
#profile:is(.away,.pre) .donut-wrap{transform:translate(var(--awayX,60vw),-50%)}
#profile.flip:is(.away,.pre) .p-data,#profile.flip:is(.away,.pre) .gline{transform:translateX(calc(-100% - 80px))}
#profile.away .p-body,#profile.away .p-head{cursor:pointer}
@media (max-width:960px){ #profile:is(.away,.pre) .donut-wrap{transform:translateX(120vw)} }
/* entry: the profile opens on the synopsis — .pre parks every card in its "away" spot with no transition for the first
   frame, then .away is added (synopsis types in) and .pre dropped; one click anywhere brings the badge + cards in */
#profile.pre :is(.p-left,.p-data,.gline,.donut-wrap,.dbar-wrap,.p-spec,.p-blobs,.p-bg .img,.p-bg .veil){transition:none!important}
#profile.pre :is(.p-left,.p-data,.gline,.donut-wrap,.dbar-wrap,.p-spec){visibility:hidden}   /* belt and braces: even before layoutDonut() has run */
/* synopsis: editorial type that flows in when the cards are swept away */
.syn{position:absolute;inset:0;z-index:4;pointer-events:none;color:var(--fg);visibility:hidden;transition:visibility 0s .9s}
#profile.away .syn{visibility:visible;transition:none}
.syn{--fg:#fff;--dim:rgba(255,255,255,.86);--hz:0,0,0}
.syn.dk{--fg:#0b0b0b;--dim:rgba(11,11,11,.8);--hz:255,255,255}
.syn .lyr{position:absolute;inset:0}
/* haze: a soft, diffuse glow of the opposite tone, sized per element (em) so big titles get a wide haze and small text a tight one */
.syn{--h0:0 0 1px rgba(var(--hz),.75);--h1:0 0 calc(.06em + 2px) rgba(var(--hz),.72);--h2:0 0 calc(.22em + 4px) rgba(var(--hz),.55);--h3:0 0 calc(.6em + 14px) rgba(var(--hz),.34)}
/* each blur is stacked several times so even thin glyphs build a dense cloud (one wide blur alone thins out to nothing) */
.syn .lyr,.syn .lyr *{text-shadow:var(--h0),var(--h1),var(--h1),var(--h1),var(--h1),var(--h1),var(--h2),var(--h2),var(--h2),var(--h2),var(--h3),var(--h3),var(--h3)}
.syn .rule i,.syn .lead small i{box-shadow:0 0 8px rgba(var(--hz),.4)}
.syn .col{position:absolute;left:6vw;top:5vh;width:min(44vw,580px);display:flex;flex-direction:column;gap:3.4vh}
.syn .col>*,.syn .date,.syn .quote{opacity:0;transform:translateY(16px);transition:opacity .45s,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:0s}
#profile.away .syn .col>*,#profile.away .syn .date,#profile.away .syn .quote{opacity:1;transform:none;transition-delay:calc(.2s + var(--i,0) * .1s)}
.syn .title{font-family:var(--grot);font-weight:500;font-size:clamp(38px,6vw,92px);line-height:.86;letter-spacing:-.045em;text-transform:uppercase;margin:0;display:flex;align-items:flex-start;gap:.18em}
.syn .title b{font-weight:500;display:block}
.syn .title em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:.36em;writing-mode:vertical-rl;line-height:1;margin-top:.05em}
.syn .rule{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:-2vh}
.syn .rule i{display:inline-block;width:46px;height:1px;background:var(--fg)}
.syn .rule u{text-decoration:none;color:var(--fg);border-bottom:1px solid var(--fg);font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:.02em;font-size:13px}

/* ---------- theme ---------- */
let userTheme='dark';
const setTheme = t=>{ document.documentElement.dataset.theme=t; };

/* ---------- router ---------- */
let view=null;
function go(v,opts={}){
  if(!['home','A','B','timeline'].includes(v)) v='home';
  if(view===v && !opts.force) return;
  view=v;
  $$('.screen').forEach(s=>s.classList.remove('active'));
  hideDtip();
  if(v==='A'||v==='B'){ renderProfile(v); setTheme(DATA.chars[v].theme); $('#profile').classList.add('active'); }
  else if(v==='timeline'){ setTheme(userTheme); $('#timeline').classList.add('active'); requestAnimationFrame(()=>{ initGraph(); if(opts.filter) setFilter(opts.filter); if(opts.focus) focusNode(opts.focus); }); }
  else { $('#home').classList.add('active'); HOME.show(); }
  if(location.hash.slice(1)!==v) location.hash=v;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ go(location.hash.slice(1)||'home'); window.scrollTo(0,0); });
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(view!=='home') go('home'); } });

  M.forEach(m=>{
    m.x=SX; m.y=y; m.tbTop=y+15+18; m.portB=m.tbTop+m.tb.offsetHeight; y=m.portB;
    const g=G.nodes.filter(n=>!n.major&&n.anchor===m).sort((a,b)=>a.kk-b.kk);
    if(g.length){ y+=48; g.forEach((n,k)=>{ n.side=k%2?1:-1; n.x=SX+n.side*dx; n.y=y+k*ROW; }); y+=(g.length-1)*ROW+46; }
    else y+=40;
    y+=15+28;                                         /* room for the next pill's CH_ label */
  });
  G.vEnd=y-15; G.H=y+40; G.tbSig=M.map(m=>m.tb.offsetHeight).join();
  G.links.forEach(l=>{ const a=l.a.major?l.b:l.a, b=l.a.major?l.a:l.b;
    l.vfar = b.major ? !(b.idx===a.anchor.idx||b.idx===a.anchor.idx+1) : a.anchor!==b.anchor; });
}
function buildBlocks(){
  /* chapter text blocks: always visible (horizontal: alternating below / above the spine) */
  const tb=$('#tblocks'); tb.innerHTML='';
  G.nodes.filter(n=>n.major).forEach((n,k)=>{ const el=document.createElement('div'); el.className='tb '+(k%2?'up':'dn'); el.style.setProperty('--i',k);
    el.innerHTML=`<div class="dt">${esc(n.t)}<span>${esc(T('timeline.chapter',{n:pad2(n.idx)}))}</span></div><h3>${esc(n.title)}</h3><div class="en">${esc(n.en||'')}</div>${(n.body||[n.d]).map(p=>`<p>${esc(p)}</p>`).join('')}`;
    tb.appendChild(el); n.tb=el; });
}
function edgePathV(l){
  /* vertical tangents; chapter ports = pill top (from above… below) / text-block bottom */
  let a=l.a,b=l.b; if(a.major&&!b.major){ const t=a; a=b; b=t; }
  let x0=a.x,y0=a.y,x1=b.x,y1=b.y;
  if(b.major) y1 = b.y>a.y ? b.y-15 : b.portB;
  if(l.vfar){ /* spans a chapter: run down the page margin, clear of the text blocks */
    const lx=a.x<G.SX?Math.max(8,G.bl-16):Math.min(G.vw-8,G.bl+G.bw+16), s=y1>y0?1:-1, r=40;
    return `M${x0} ${y0} C${x0} ${y0+s*r*.7} ${lx} ${y0+s*r*.3} ${lx} ${y0+s*r} L${lx} ${y1-s*r} C${lx} ${y1-s*r*.3} ${x1} ${y1-s*r*.7} ${x1} ${y1}`; }
  const dy=(y1-y0)*.5, bow=(!b.major&&a.x===b.x)?a.side*26:0;
  return `M${x0} ${y0} C${x0+bow} ${y0+dy} ${x1+bow} ${y1-dy} ${x1} ${y1}`;
}
function edgePath(l){
  if(G.vert) return edgePathV(l);
  /* cubic curve with horizontal tangents, leaving chapters from their ports */
  let a=l.a,b=l.b; if(a.major&&!b.major){ const t=a; a=b; b=t; }           /* a = minor, b = chapter or minor */
  let x0=a.x,y0=a.y,x1=b.x,y1=b.y;
  if(b.major){ const left=a.x<b.x; x1=b.x+(left?-1:1)*b.pw/2; }
  const dx=(x1-x0)*.5; return `M${x0} ${y0} C${x0+dx} ${y0} ${x1-dx} ${y1} ${x1} ${y1}`;
}
function renderGraph(){
  const s=$('#graph'); s.innerHTML=''; s.classList.remove('ready'); s.setAttribute('width',G.W); s.setAttribute('height',G.H); s.setAttribute('viewBox',`0 0 ${G.W} ${G.H}`); s.style.height=G.vert?G.H+'px':'';
  s.innerHTML=`<defs><filter id="tglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
  const ge=sv('g',{class:'edges'},s);
  /* spine segments between chapter ports */
  const M=G.nodes.filter(n=>n.major);
  if(G.vert){ const X=G.SX;
    sv('line',{class:'spine',x1:X,y1:G.vTop,x2:X,y2:M[0].y-15,opacity:.4,'stroke-dasharray':'2 4'},ge);
    M.forEach((m,i)=>{ sv('line',{class:'spine',x1:X,y1:m.y+15,x2:X,y2:m.tbTop},ge); sv('circle',{cx:X,cy:m.portB,r:2.6,fill:'var(--fg)'},ge);
      if(i<M.length-1) sv('line',{class:'spine',x1:X,y1:m.portB,x2:X,y2:M[i+1].y-15},ge); });
    const L=M[M.length-1]; sv('line',{class:'spine',x1:X,y1:L.portB,x2:X,y2:G.vEnd,opacity:.4,'stroke-dasharray':'2 4'},ge);
    sv('path',{d:`M${X} ${G.vEnd} l-4.5 -9 h9 z`,fill:'var(--fg)',opacity:.6},ge);
  } else {
  for(let i=0;i<M.length-1;i++) sv('line',{class:'spine',x1:M[i].x+M[i].pw/2,y1:G.spine,x2:M[i+1].x-M[i+1].pw/2,y2:G.spine},ge);
  sv('line',{class:'spine',x1:X0-110,y1:G.spine,x2:M[0].x-M[0].pw/2,y2:G.spine,opacity:.4,'stroke-dasharray':'2 4'},ge);
  sv('line',{class:'spine',x1:M[M.length-1].x+M[M.length-1].pw/2,y1:G.spine,x2:G.W-X0+110,y2:G.spine,opacity:.4,'stroke-dasharray':'2 4'},ge);
  sv('path',{d:`M${G.W-X0+110} ${G.spine} l-9 -4.5 v9 z`,fill:'var(--fg)',opacity:.6},ge);
  }
  G.links.forEach((l,i)=>{ const far=!G.vert&&Math.abs(l.a.x-l.b.x)>GAP*1.15; l.el=sv('path',{class:'edge '+l.kind+(far?' far':'')+(G.vert&&l.vfar?' vfar':''),pathLength:1,style:`--i:${i}`},ge); });
  const gn=sv('g',{class:'nodes'},s);
  G.nodes.forEach((n,i)=>{
    const g=sv('g',{class:'node '+n.kind+(n.major?' major':''),style:`--i:${i}`},gn); n.el=g;
    if(n.major){ const w=n.pw,h=30;
      sv('rect',{class:'pill',x:-w/2,y:-h/2,width:w,height:h,rx:h/2},g);
      if(G.vert){ sv('circle',{class:'port',cx:0,cy:-h/2,r:2.6},g); sv('circle',{class:'port',cx:0,cy:h/2,r:2.6},g); }
      else { sv('circle',{class:'port',cx:-w/2,cy:0,r:2.6},g); sv('circle',{class:'port',cx:w/2,cy:0,r:2.6},g); }
      sv('text',{class:'pl',x:0,y:4,'text-anchor':'middle'},g).textContent=n.title;
      sv('text',{class:'idx',x:-w/2,y:-24},g).textContent=T('timeline.chapter',{n:pad2(n.idx)});
    } else {
      sv('circle',{class:'glow',r:9},g);
      if(n.kind==='event') sv('circle',{class:'shape',r:3.6},g);
      else if(n.kind==='dialogue') sv('path',{class:'shape',d:'M0 -5 L5 0 L0 5 L-5 0 Z'},g);
      else sv('path',{class:'shape',d:'M-3.6 -3.6 L3.6 3.6 M-3.6 3.6 L3.6 -3.6'},g);
      const isKr=/[가-힣]/.test(n.title); const up=n.lvl>0;
      if(G.vert){ /* label on the outer side of the node, away from the spine and the curves */
        const sd=n.side, t=sv('text',{class:isKr?'kr':'',x:sd*12,y:3.5,'text-anchor':sd>0?'start':'end'},g); t.textContent=n.title;
        let tw=isKr?krW(n.title):n.title.length*6.2; try{ const m=t.getComputedTextLength(); if(m>0) tw=m; }catch{}
        n.chars.forEach((c,k)=>sv('circle',{class:'cm '+c,cx:sd*(12+tw+7+k*6),cy:0,r:2},g));
      } else {
      const t=sv('text',{class:isKr?'kr':'',x:0,y:up?-11:18,'text-anchor':'middle'},g); t.textContent=n.title;
      const tw=isKr?krW(n.title):n.title.length*6.2; n.chars.forEach((c,k)=>sv('circle',{class:'cm '+c,cx:tw/2+8+k*6,cy:up?-14:15,r:2},g));
      }
    }
    g.addEventListener('mouseenter',()=>{ G.hover=n; if(!G.pinned&&!n.major) showPop(n,false); setHi(n,true); n.tb&&n.tb.classList.add('hi'); });
    g.addEventListener('mouseleave',()=>{ n.tb&&n.tb.classList.remove('hi'); G.hover=null; if(!G.pinned) hidePop(); if(G.pinned!==n) setHi(n,false); if(G.pinned) setHi(G.pinned,true); });
    g.addEventListener('click',e=>{ e.stopPropagation(); if(n.major) return; if(G.pinned===n){ G.pinned=null; showPop(n,false); } else { G.pinned=n; showPop(n,true); setHi(n,true); } });
  });
  /* hover ring (HUD) */
  const ring=sv('g',{class:'ring',id:'tring'},s);
  sv('circle',{class:'r1',r:22},ring); sv('circle',{class:'r2',r:30},ring);
  [[26,0,34,0],[-26,0,-34,0],[0,26,0,34],[0,-26,0,-34]].forEach(([x1,y1,x2,y2])=>sv('line',{x1,y1,x2,y2},ring));
  sv('text',{x:36,y:-30,id:'tringT'},ring);
  Object.assign($('#tblocks').style,{width:G.W+'px',height:G.H+'px'});
  placeBlocks();
  positionGraph(); applyFilter();
  setTimeout(()=>s.classList.add('ready'),1500+G.nodes.length*45);
}
function placeBlocks(){ G.nodes.filter(n=>n.major&&n.tb).forEach(n=>{ const el=n.tb, h=el.offsetHeight, up=el.classList.contains('up');
  if(G.vert){ el.style.left=G.bl+'px'; el.style.top=n.tbTop+'px'; return; }
  el.style.left=(n.x-n.pw/2)+'px'; el.style.top=(up?G.spine-46-h:G.spine+40)+'px'; }); }
function positionGraph(){
  G.nodes.forEach(n=>{ n.el.style.setProperty('--x',n.x.toFixed(1)+'px'); n.el.style.setProperty('--y',n.y.toFixed(1)+'px'); n.el.style.transform=`translate(${n.x.toFixed(1)}px,${n.y.toFixed(1)}px)`; });
  G.links.forEach(l=>l.el.setAttribute('d',edgePath(l)));
  const ring=$('#tring'); if(ring&&G.hover) ring.setAttribute('transform',`translate(${G.hover.x} ${G.hover.y})`);
}
function setHi(n,on){
  const nb=new Set([n.id]);
  G.links.forEach(l=>{ const hit=l.a===n||l.b===n; l.el.classList.toggle('hi',on&&hit); if(hit){nb.add(l.a.id);nb.add(l.b.id);} l.el.classList.toggle('dim',on&&!hit); });
  G.nodes.forEach(m=>{ m.el.classList.toggle('hi',on&&m===n); m.el.classList.toggle('dim',on&&!nb.has(m.id)); });
  const ring=$('#tring'); if(ring){ ring.classList.toggle('on',on&&!n.major); if(on&&!n.major){ ring.setAttribute('transform',`translate(${n.x} ${n.y})`); $('#tringT').textContent=n.id.toUpperCase()+' · '+T('timeline.ring.'+n.kind); } }
}
function showPop(n,pinned){
  const c=$('#tpop'), box=$('#gscroll'); const kindL=esc(T('timeline.kind.'+n.kind));
  const linked=[...new Set(G.links.filter(l=>l.a===n||l.b===n).map(l=>l.a===n?l.b:l.a))];
  const isKr=/[가-힣]/.test(n.title);
  c.innerHTML=`<div class="h"><span><b>${kindL}</b> · ${n.major?esc(n.t):esc(n.id.toUpperCase())}${n.major?' · '+esc(T('timeline.chapter',{n:pad2(n.idx)})):''}</span><span class="pin">${esc(pinned?T('timeline.pinned'):T('timeline.pin'))}</span></div>
    <div class="t ${isKr?'kr':''}">${esc(n.title)}</div>${n.en?`<div class="en">${esc(n.en)}</div>`:''}
    <div class="who">${n.chars.map(x=>`<span class="${x}">${esc(T('timeline.who.'+x))}</span>`).join('')}</div>
    ${n.lines?`<ul class="dl">${n.lines.map(([w,l])=>`<li class="${w}"><b>${esc(T('timeline.speaker.'+w))}</b><span>${esc(l)}</span></li>`).join('')}</ul>`:`<div class="d">${esc(n.d||'')}</div>`}
    ${linked.length?`<div class="links"><span class="lb">${esc(T('timeline.linked'))}</span>${linked.map(m=>`<span data-id="${m.id}">${esc(m.major?T('timeline.chapter',{n:pad2(m.idx)}):m.id)} ${esc(m.title)}</span>`).join('')}</div>`:''}`;
  if(G.vert) placePopV(n,c,pinned); else {
  /* anchor beside the node, flip to stay inside the visible part of the scroller */
  const pw=300, vx0=box.scrollLeft, vx1=vx0+box.clientWidth, nx=n.x+(n.major?n.pw/2:0);
  const right=nx+22+pw<=vx1-12; c.classList.toggle('R',right); c.classList.toggle('L',!right);
  const pw2=c.offsetWidth||pw, hw=n.major?n.pw/2:0, fitsR=nx+22+pw2<=vx1-12, fitsL=n.x-hw-22-pw2>=vx0+12;
  c.classList.add('show'); const ph=c.offsetHeight;
  if(fitsR||fitsL){ c.classList.toggle('R',fitsR); c.classList.toggle('L',!fitsR); c.style.left=(fitsR?nx+22:n.x-hw-22-pw2)+'px'; c.style.top=Math.max(12,Math.min(G.H-ph-12,n.y-18))+'px'; }
  else { c.classList.remove('R','L'); const lx=Math.max(vx0+12,Math.min(vx1-12-pw2,n.x-pw2/2)); c.style.left=lx+'px'; const below=n.y+(n.major?44:28); c.style.top=(below+ph<=G.H-12?below:Math.max(12,n.y-(n.major?44:28)-ph))+'px'; }
  }
  $$('.links span[data-id]',c).forEach(sp=>sp.addEventListener('click',()=>focusNode(sp.dataset.id)));
  c.querySelector('.pin').addEventListener('click',()=>{ G.pinned=null; hidePop(); G.nodes.forEach(m=>m.el.classList.remove('dim','hi')); G.links.forEach(l=>l.el.classList.remove('hi','dim')); $('#tring')?.classList.remove('on'); });
}
/* vertical: below / above the node (whichever side has room on screen), clamped to the column */
function vScroller(){ const t=$('#timeline'); return t.clientHeight<=innerHeight&&t.scrollHeight>t.clientHeight+1?t:window; }   /* >960px portrait: the screen itself scrolls */
function placePopV(n,c,pinned){
  c.classList.remove('R','L','T','B'); c.classList.add('show');
  const pw2=c.offsetWidth, ph=c.offsetHeight, off=n.major?30:18;
  const ax=n.major?n.x:n.x+n.side*40;                 /* lean toward the label side */
  const lx=Math.max(12,Math.min(G.vw-12-pw2,ax-pw2/2)); c.style.left=lx+'px';
  const top0=$('#gscroll').getBoundingClientRect().top, ny=top0+n.y, vh=innerHeight;
  const spB=vh-12-(ny+off), spA=ny-off-12, below=spB>=ph||spB>=spA;
  const y=below?n.y+off:n.y-off-ph; c.style.top=y+'px';
  c.classList.add(below?'T':'B'); c.style.setProperty('--tx',Math.max(16,Math.min(pw2-16,n.x-lx))+'px');   /* accent tick points at the node */
  if(pinned){ const t=top0+y, b=t+ph; let d=0; if(b>vh-12) d=b-(vh-12); if(t+(-d)<12) d=t-12;
    if(d) vScroller().scrollBy({top:d,behavior:'smooth'}); }
}
function hidePop(){ $('#tpop').classList.remove('show'); }
function focusNode(id){
  const n=G.byId[id]; if(!n) return;
  const box=$('#gscroll');
  if(G.vert){ vScroller().scrollBy({top:n.el.getBoundingClientRect().top-innerHeight*.4,behavior:'smooth'}); G.pinned=n; setHi(n,true); setTimeout(()=>showPop(n,true),520); return; }
  box.scrollTo({left:n.x-box.clientWidth/2,behavior:'smooth'});
  G.pinned=n; setHi(n,true); setTimeout(()=>showPop(n,true),420);
}
function setFilter(f){ G.filter=f; $$('.glegend .f').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); applyFilter(); }
function applyFilter(){
  const f=G.filter; const ok=n=> f==='all' || (f==='AB'? (n.chars.includes('A')&&n.chars.includes('B')) : n.chars.includes(f));
  G.nodes.forEach(n=>n.el.classList.toggle('off',!ok(n)));
  G.links.forEach(l=>l.el.classList.toggle('off',!(ok(l.a)&&ok(l.b))));
}
$$('.glegend .f').forEach(b=>b.addEventListener('click',()=>setFilter(G.filter===b.dataset.f?'all':b.dataset.f)));
/* graph background: click clears pin, wheel → horizontal scroll, drag-to-pan */
(()=>{ const box=$('#gscroll'); let pan=null;
  box.addEventListener('click',e=>{ if(e.target.closest('.node')||e.target.closest('.tpop')) return; G.pinned=null; hidePop(); G.nodes.forEach(n=>n.el.classList.remove('dim','hi')); G.links.forEach(l=>l.el.classList.remove('hi','dim')); $('#tring')?.classList.remove('on'); });
  box.addEventListener('wheel',e=>{ if(G.vert) return; if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ box.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  box.addEventListener('pointerdown',e=>{ if(G.vert) return; if(e.target.closest('.node')||e.target.closest('.tpop')) return; pan={x:e.clientX,sl:box.scrollLeft}; box.classList.add('dragging'); });
  window.addEventListener('pointermove',e=>{ if(!pan) return; box.scrollLeft=pan.sl-(e.clientX-pan.x); });
  window.addEventListener('pointerup',()=>{ pan=null; box.classList.remove('dragging'); });
  box.addEventListener('scroll',()=>{ if(G.pinned) showPop(G.pinned,true); });
})();
window.addEventListener('resize',()=>{ if(view==='timeline') initGraph(); });
if(document.fonts) document.fonts.ready.then(()=>{ if(G.built&&G.vert&&G.tbSig!==G.nodes.filter(n=>n.major).map(m=>m.tb.offsetHeight).join()){ G.vw=0; initGraph(); } });   /* block heights change once Pretendard lands */

/* ---------- boot ---------- */
const Q=new URLSearchParams(location.search); if(Q.get('theme')){ userTheme=Q.get('theme'); }
if(Q.get('notrans')){ const st=document.createElement('style'); st.textContent='*{transition-duration:0s!important;transition-delay:0s!important;animation-duration:0s!important;animation-delay:0s!important}'; document.head.appendChild(st); }
/* static UI texts from narrative-data_old.js */
$$('[data-t]').forEach(e=>{ e.textContent=T(e.dataset.t); });
$('#fTagsR').innerHTML=(UI.final.tagsRight||[]).map(t=>`<span>${esc(t)}</span>`).join('');
HOME.init();
go(location.hash.slice(1)||'home',{force:true});
</script>
